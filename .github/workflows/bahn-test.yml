name: bahn-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: bahn.de Ortssuche
        run: |
          curl -s -o /tmp/out.json -w "HTTP %{http_code}\n" \
            -H "User-Agent: Mozilla/5.0" -H "Accept: application/json" \
            "https://www.bahn.de/web/api/reiseloesung/orte?suchbegriff=Hbf&typ=ALL&limit=3"
          head -c 300 /tmp/out.json; echo
