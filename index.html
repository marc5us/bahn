<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bahn-Abfahrten</title>
<style>
:root{--red:#e2001a;--red2:#b30015;--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--ok:#15803d;--late:#dc2626;--warn:#b45309;--radius:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d10;--card:#15181e;--text:#e5e7eb;--muted:#9ca3af;--line:#262b34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:var(--red);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.top .in{max-width:1100px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:.2px;margin-right:auto}
.stand{font-size:12px;opacity:.85}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.search{position:relative;margin-bottom:16px}
.search input{width:100%;font:inherit;font-size:16px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.search input:focus{outline:2px solid var(--red);border-color:transparent}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden;z-index:10}
.sugg button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;color:var(--text);font:inherit;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:color-mix(in srgb,var(--red) 7%,transparent)}
.sugg small{color:var(--muted)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.hero h2{margin:0 0 4px;font-size:22px}
.hero .meta{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button,.chip{font:inherit;border:0;background:none;color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--red);color:#fff}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px}
.chip.on{border-color:var(--red);color:var(--red)}
.bar input{margin-left:auto;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);min-width:200px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:color-mix(in srgb,var(--line) 35%,transparent)}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--red) 5%,transparent)}
.time{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;white-space:nowrap}
.delay{font-size:12px;font-weight:700;white-space:nowrap}
.ok{color:var(--ok)}.late{color:var(--late)}
.cancel td.time{text-decoration:line-through;color:var(--late)}
.tag{display:inline-block;min-width:54px;text-align:center;padding:4px 8px;border-radius:7px;color:#fff;font-weight:700;font-size:13px;background:#6b7280;white-space:nowrap}
.dest{font-weight:600}
.sub{color:var(--muted);font-size:12px}
.plat{display:inline-block;min-width:34px;text-align:center;border:1px solid var(--line);border-radius:7px;padding:3px 6px;font-weight:700;font-variant-numeric:tabular-nums}
.msgs{display:inline-block;font-size:12px;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);padding:2px 8px;border-radius:999px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin:14px 2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal[hidden]{display:none}
.sheet{background:var(--card);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet .head{background:var(--red);color:#fff;padding:18px 20px;border-radius:18px 18px 0 0}
.sheet .head h3{margin:0;font-size:20px}
.sheet .head .sub{color:rgba(255,255,255,.85)}
.sheet .body{padding:18px 20px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.grid small{display:block;color:var(--muted);font-size:11px}
.grid b{font-variant-numeric:tabular-nums}
.msglist{list-style:none;padding:0;margin:0}
.msglist li{border-left:3px solid var(--warn);padding:6px 10px;margin-bottom:6px;background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:6px}
.close{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.2);color:#fff;border:0;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.hide-sm{display:none}.bar input{margin-left:0;width:100%}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand">🚆 Bahn-Abfahrten</div>
  <div class="stand" id="stand"></div>
</div></header>

<main class="wrap">
  <div class="search">
    <input id="q" placeholder="Bahnhof suchen, z. B. Nürnberg Hbf" autocomplete="off">
    <div class="sugg" id="sugg" hidden></div>
  </div>

  <section id="view" hidden>
    <div class="hero">
      <h2 id="sName"></h2>
      <div class="meta" id="sMeta"></div>
      <div class="kpis" id="kpis"></div>
    </div>

    <div class="bar">
      <div class="seg">
        <button data-mode="dep" class="on">Abfahrten</button>
        <button data-mode="arr">Ankünfte</button>
      </div>
      <button class="chip on" data-f="all">Alle</button>
      <button class="chip" data-f="fern">Fernverkehr</button>
      <button class="chip" data-f="nah">Nahverkehr</button>
      <button class="chip" data-f="late">Verspätet</button>
      <input id="filter" placeholder="Zugnummer oder Ziel filtern">
    </div>

    <div class="card"><table>
      <thead><tr id="head"></tr></thead>
      <tbody id="board"></tbody>
    </table></div>
    <p class="note">Quelle: Deutsche Bahn AG (CC BY 4.0), über infranode.dev. Aktualisierung alle 60 Sekunden.</p>
  </section>

  <section id="welcome" class="empty">Bahnhof suchen, um Abfahrten und Ankünfte zu sehen.</section>
</main>

<div id="modal" hidden><div class="sheet">
  <button class="close" id="close" aria-label="Schließen">×</button>
  <div class="head" id="dHead"></div>
  <div class="body" id="dBody"></div>
</div></div>

<script>
const INFRA="https://infranode.dev/api/v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tm=iso=>iso?new Date(iso).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):"–";

// Farben: Betreiber zuerst (sobald das Feld "operator" geliefert wird), sonst Zuggattung
const OPERATOR_COLORS={
  "deutsche bahn":"#e2001a",
  "db fernverkehr":"#e2001a",
  "db regio":"#e2001a"
  // weitere Betreiber hier eintragen, z. B. "oberpfalzbahn":"#hex"
};
const CATEGORY_COLORS={ICE:"#c4000f",IC:"#e2001a",EC:"#e2001a",RE:"#1d4f91",RB:"#3b7a3e",S:"#008d4f"};
function brandColor(d){
  const op=(d.operator||"").toLowerCase();
  for(const k in OPERATOR_COLORS) if(op.includes(k)) return OPERATOR_COLORS[k];
  return CATEGORY_COLORS[d.category]||"#6b7280";
}

// Verspätungsursachen nach Richtlinie 420.9001
const VERSP={10:"Fahrplanerstellung",12:"Fehldisposition",13:"Vorbereitung",14:"Anfangsverspätung DB InfraGO AG",18:"Betriebliches Personal DB InfraGO AG",19:"Sonstiges Betriebsdurchführung DB InfraGO AG",20:"Stromversorgungsanlagen (Fahrstrom)",21:"Telekommunikationsanlagen",22:"Bauwerke",23:"Fahrbahn",24:"Bahnübergangsicherungsanlagen",25:"Leit- und Sicherungstechnik",26:"Weichen",27:"Fahrzeuge DB InfraGO AG",28:"Technisches Personal DB InfraGO AG",29:"Sonstiges Technik DB InfraGO AG",30:"Mängellangsamfahrstelle",31:"Bauarbeiten",32:"Unregelmäßigkeiten bei Bauarbeiten",40:"Nächster EIU",41:"Vorheriger EIU",46:"Anlagen DB Energie",47:"Anlagen Personenbahnhöfe",48:"Personal Personenbahnhöfe / DB Energie",49:"Sonstiges Personenbahnhöfe / DB Energie",50:"Haltezeitüberschreitung",51:"Antrag EVU",52:"Ladearbeiten",53:"Unregelmäßigkeiten an der Ladung",54:"Verkehrliche Zugvorbereitung",57:"Keine Meldung durch EVU",58:"Verkehrliches Personal EVU",59:"Sonstige verkehrliche Gründe EVU",60:"Umlauf- und Einsatzplanung",61:"Zugbildung durch EVU",62:"Reisezugwagen",63:"Güterwagen",64:"Triebfahrzeuge",68:"Technisches Personal EVU",69:"Sonstiges Fahrzeuge EVU",70:"Nächstes EVU",71:"Vorheriges EVU",80:"Externe Einflüsse bei externen EIU",81:"Streik (Anordnung NLZ)",82:"Witterung",83:"Schmierfilm",84:"Behörden",85:"Fremdeinwirkung",90:"Gefährliches Ereignis",91:"Zugfolge (Vorrang anderer Züge)",92:"Zugfolge (Zug war verspätet)",93:"Umlauf",94:"Anschluss",95:"Flügeln",96:"Weitere Untersuchung erforderlich"};
function msgInfo(m){
  if(typeof m==="string") return {title:m,time:""};
  const title=m.type==="d"?"Verspätungsursache: "+(VERSP[m.code]||"Sonstige Ursache"):m.type==="q"?"Qualitätsmeldung":m.type==="f"?"Störung":"Hinweis";
  return {title,time:m.timestamp?tm(m.timestamp):""};
}
function uniqMsgs(list){
  const map=new Map();
  for(const m of list||[]){
    const k=(m.type||"")+"|"+(m.code||"")+"|"+(m.text||"");
    const e=map.get(k); if(e) e.n++; else map.set(k,{m,n:1});
  }
  return [...map.values()].map(({m,n})=>({...msgInfo(m),n}));
}

// Bahnhofsliste lokal
let STATIONS=null;
async function loadStations(){
  if(!STATIONS){
    const r=await fetch("stationen.json");
    if(!r.ok) throw new Error("stationen.json fehlt");
    STATIONS=await r.json();
  }
  return STATIONS;
}
const norm=s=>s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[()\-.]/g," ").replace(/\s+/g," ").trim();
async function findStations(q){
  const list=await loadStations();
  const t=norm(q).split(" ").filter(Boolean);
  return list.filter(s=>{const n=norm(s.n);return t.every(x=>n.includes(x))})
    .sort((a,b)=>(a.v==="FV"?0:1)-(b.v==="FV"?0:1)||a.n.length-b.n.length)
    .slice(0,8);
}
let sugTimer;
$("q").oninput=()=>{
  clearTimeout(sugTimer);
  const q=$("q").value.trim();
  if(q.length<2){$("sugg").hidden=true;return}
  sugTimer=setTimeout(async()=>{
    const list=await findStations(q);
    $("sugg").innerHTML=list.map(s=>`<button data-eva="${esc(s.e)}" data-name="${esc(s.n)}">${esc(s.n)}<small>${esc(s.v)} · ${esc(s.e)}</small></button>`).join("")||'<div class="empty" style="padding:14px">Kein Bahnhof gefunden</div>';
    $("sugg").hidden=false;
  },120);
};
$("q").onkeydown=async e=>{
  if(e.key!=="Enter") return;
  const list=await findStations($("q").value.trim());
  if(list[0]) select(list[0].e,list[0].n);
};
$("sugg").onclick=e=>{
  const b=e.target.closest("button[data-eva]"); if(!b) return;
  select(b.dataset.eva,b.dataset.name);
};
document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("sugg").hidden=true});

// Zustand
let mode="dep",filt="all",text="",eva=null,name="",rows=[],timer,stand=null;

function select(id,n){
  eva=id; name=n;
  $("sugg").hidden=true; $("q").value=n;
  $("welcome").hidden=true; $("view").hidden=false;
  $("sName").textContent=n;
  $("sMeta").textContent="EVA "+id;
  clearInterval(timer); loadBoard(); timer=setInterval(loadBoard,60000);
}

async function loadBoard(){
  if(!eva) return;
  const isDep=mode==="dep";
  $("head").innerHTML=isDep
    ?"<th>Zeit</th><th>Zug</th><th>Ziel</th><th>Gl.</th><th class='hide-sm'>Hinweise</th>"
    :"<th>Zeit</th><th>Zug</th><th>Herkunft</th><th>Gl.</th><th class='hide-sm'>Hinweise</th>";
  try{
    const r=await fetch(`${INFRA}/stations/${encodeURIComponent(eva)}/${isDep?"departures":"arrivals"}`);
    if(!r.ok) throw new Error("Status "+r.status);
    const d=(await r.json()).data||{};
    if(d.source_status==="disabled") throw new Error("Datenquelle derzeit deaktiviert");
    rows=d.payload?.[isDep?"departures":"arrivals"]||[];
    stand=d.retrieved_at?new Date(d.retrieved_at):new Date();
    $("stand").textContent="Stand "+stand.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    renderKpis(); render();
  }catch(e){
    $("board").innerHTML=`<tr><td colspan="5" class="empty">Fehler: ${esc(e.message)}</td></tr>`;
  }
}

function renderKpis(){
  const total=rows.length;
  const cancelled=rows.filter(d=>d.cancelled).length;
  const late=rows.filter(d=>!d.cancelled&&(d.delay_minutes||0)>0).length;
  const onTime=total-cancelled-late;
  const pct=total-cancelled?Math.round(onTime/(total-cancelled)*100):0;
  $("kpis").innerHTML=[
    [total,"Einträge"],[pct+" %","pünktlich"],[late,"verspätet"],[cancelled,"fallen aus"]
  ].map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");
}

function passes(d){
  if(filt==="fern"&&!d.long_distance) return false;
  if(filt==="nah"&&d.long_distance) return false;
  if(filt==="late"&&!((d.delay_minutes||0)>0||d.cancelled)) return false;
  if(text){
    const h=[d.line,d.train_number,d.destination,d.origin,d.category].join(" ").toLowerCase();
    if(!h.includes(text)) return false;
  }
  return true;
}

function render(){
  const isDep=mode==="dep";
  const list=rows.filter(passes);
  if(!list.length){$("board").innerHTML='<tr><td colspan="5" class="empty">Keine Einträge für diese Auswahl</td></tr>';return}
  $("board").innerHTML=list.map(d=>{
    const i=rows.indexOf(d);
    const delay=d.delay_minutes||0;
    const status=d.cancelled
      ?'<span class="delay late">fällt aus</span>'
      :delay>0?`<span class="delay late">+${delay} min</span>`:'<span class="delay ok">pünktlich</span>';
    const n=uniqMsgs(d.messages).length;
    return `<tr class="${d.cancelled?"cancel":""}" data-i="${i}">
      <td><div class="time">${tm(d.planned_time)}</div>${status}</td>
      <td><span class="tag" style="background:${brandColor(d)}">${esc(d.line||d.category||"?")}</span>
          <div class="sub">${esc(d.train_number||"")}</div></td>
      <td><div class="dest">${esc(isDep?d.destination:d.origin)}</div><div class="sub">${d.long_distance?"Fernverkehr":"Nahverkehr"}</div></td>
      <td><span class="plat">${esc(d.platform||"–")}</span></td>
      <td class="hide-sm">${n?`<span class="msgs">${n} Hinweis${n>1?"e":""}</span>`:""}</td>
    </tr>`;
  }).join("");
}

$("board").onclick=e=>{
  const tr=e.target.closest("tr[data-i]"); if(!tr) return;
  const d=rows[+tr.dataset.i];
  const isDep=mode==="dep";
  const c=brandColor(d);
  $("dHead").style.background=c;
  $("dHead").innerHTML=`<h3>${esc(d.line||"")} ${isDep?"→":"←"} ${esc(isDep?d.destination:d.origin)}</h3>
    <div class="sub">${esc(d.category||"")} ${esc(d.train_number||"")} · ${d.long_distance?"Fernverkehr":"Nahverkehr"}</div>`;
  const msgs=uniqMsgs(d.messages).map(x=>`<li><b>${esc(x.title)}</b>${x.n>1?` <span class="sub">×${x.n}</span>`:""}${x.time?` <span class="sub">· ${esc(x.time)}</span>`:""}</li>`).join("");
  $("dBody").innerHTML=`
    <div class="sec">Fahrt</div>
    <div class="grid">
      <div><small>Plan-${isDep?"Abfahrt":"Ankunft"}</small><b>${tm(d.planned_time)}</b></div>
      <div><small>Verspätung</small><b class="${d.cancelled||(d.delay_minutes||0)>0?"late":"ok"}">${d.cancelled?"fällt aus":(d.delay_minutes||0)+" min"}</b></div>
      <div><small>Gleis</small><b>${esc(d.platform||"–")}</b></div>
      <div><small>${isDep?"Ziel":"Herkunft"}</small><b>${esc(isDep?d.destination:d.origin)}</b></div>
    </div>
    <div class="sec">Meldungen</div>
    ${msgs?`<ul class="msglist">${msgs}</ul>`:'<div class="sub">Keine Meldungen</div>'}
    <div class="sec">Unterwegshalte & Fahrzeug</div>
    <div class="sub">Zu diesem Zug sind über diese Quelle keine Halte, Fahrzeug- oder Wagenreihungsdaten verfügbar.</div>`;
  $("modal").hidden=false;
};
$("close").onclick=()=>$("modal").hidden=true;
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").hidden=true};

document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));
  mode=b.dataset.mode; if(eva) loadBoard();
});
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));
  filt=c.dataset.f; render();
});
$("filter").oninput=e=>{text=e.target.value.trim().toLowerCase(); render()};
</script>
</body>
</html>
